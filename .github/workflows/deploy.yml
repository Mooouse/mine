name: Build Rust WASM and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Run Rust world and water simulation tests
        run: cargo test --lib
      - name: Compile game engine
        run: wasm-pack build --target web --release --out-dir pkg
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r web/. dist/
          cp -r pkg dist/pkg
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Browser smoke test (WASM + WebGL2)
        run: |
          which google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/mine_http.log 2>&1 &
          node tests/browser-smoke.mjs
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
