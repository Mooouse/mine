name: Build MINE and publish browser build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Run Rust world and water simulation tests
        run: cargo test --lib
      - name: Compile game engine
        run: wasm-pack build --target web --release --out-dir pkg
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r web/. dist/
          cp -r pkg dist/pkg
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Browser smoke test (WASM + WebGL2)
        run: |
          which google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/mine_http.log 2>&1 &
          node tests/browser-smoke.mjs
      # Keep a fully playable, versioned static build in Git even if the
      # GitHub Pages backend is stuck in 'updating_pages' (Nov 2026).
      - name: Publish direct-play static build to site branch
        id: static
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/mine-static
          cp -r dist/. /tmp/mine-static/
          cd /tmp/mine-static
          touch .nojekyll
          test -s pkg/mine_web.js
          test -s pkg/mine_web_bg.wasm
          git init -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # wasm-pack ships an internal .gitignore; force-add the Rust binaries.
          git add --force --all
          git commit -m "Browser build of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Static build: https://raw.githack.com/${GITHUB_REPOSITORY}/site/index.html"
      - name: Test published standalone browser build
        continue-on-error: true
        env:
          GAME_URL: https://raw.githack.com/${{ github.repository }}/${{ steps.static.outputs.sha }}/index.html
        run: node tests/browser-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Retain an on-demand Pages retry; do not make each main-branch build
  # hang for ten minutes while the GitHub Pages deployment service is stuck.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
